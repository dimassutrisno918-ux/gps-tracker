
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPS Share</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 16px;
    }

    h1 { color: #2563eb; }

    button {
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
    }

    .stop { background: #dc2626; }

    #map {
      height: 350px;
      margin-top: 15px;
      border-radius: 12px;
    }

    #info { overflow-wrap: anywhere; }
  </style>
</head>

<body>
  <div class="card">
    <h1>📍 GPS Share</h1>
    <p>Berbagi lokasi dengan persetujuan pengguna.</p>

    <p id="status">Status: Belum dimulai</p>
    <p id="info">Koordinat: -</p>

    <button onclick="mulaiGPS()">Mulai GPS Saya</button>
    <button class="stop" onclick="berhentiGPS()">
      Berhenti Berbagi Lokasi
    </button>

    <button onclick="bagikan()">Bagikan Lokasi</button>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map("map").setView([-2.5, 118], 5);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    let marker = null;
    let accuracyCircle = null;
    let watchId = null;
    let lastLocation = null;

    function mulaiGPS() {
      if (!navigator.geolocation) {
        alert("Browser tidak mendukung GPS.");
        return;
      }

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
      }

      document.getElementById("status").textContent =
        "Meminta izin lokasi...";

      watchId = navigator.geolocation.watchPosition(
        function(pos) {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const accuracy = pos.coords.accuracy;
          const point = [lat, lng];

          lastLocation = { lat, lng };

          document.getElementById("status").textContent =
            "GPS aktif";

          document.getElementById("info").textContent =
            "Latitude: " + lat.toFixed(6) +
            " | Longitude: " + lng.toFixed(6) +
            " | Akurasi: ±" + Math.round(accuracy) + " m";

          if (!marker) {
            marker = L.marker(point).addTo(map);
            accuracyCircle = L.circle(point, {
              radius: accuracy
            }).addTo(map);
          } else {
            marker.setLatLng(point);
            accuracyCircle.setLatLng(point);
            accuracyCircle.setRadius(accuracy);
          }

          marker.bindPopup("Lokasi perangkat saya");
          map.setView(point, 16);
        },

        function(err) {
          document.getElementById("status").textContent =
            "GPS gagal: " + err.message;
        },

        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 20000
        }
      );
    }

    function berhentiGPS() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      document.getElementById("status").textContent =
        "Berbagi lokasi dihentikan";

      lastLocation = null;
    }

    function bagikan() {
      if (!lastLocation) {
        alert("Aktifkan GPS terlebih dahulu.");
        return;
      }

      const url = "https://www.google.com/maps?q=" +
        lastLocation.lat + "," + lastLocation.lng;

      if (navigator.share) {
        navigator.share({
          title: "Lokasi GPS saya",
          text: "Saya membagikan lokasi ini kepada kamu.",
          url: url
        }).catch(() => {});
      } else {
        window.prompt("Salin tautan lokasi ini:", url);
      }
    }
  </script>
</body>
</html>
